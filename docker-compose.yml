version: "3.8"

services:
  traefik:
    image: traefik:v2.10
    container_name: traefik
    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
    ports:
      - "80:80"      # Traefik Web proxy
      - "8080:8080"  # Traefik Dashboard (development view)
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

  importer-app:
    build: .
    container_name: dhis2-importer
    env_file:
      - .env
    volumes:
      - .:/app
    ports:
      - "8888:8888" # Direct port mapping for Jupyter Lab (optional backup)
      - "8501:8501" # Direct port mapping for Streamlit (optional backup)
    labels:
      - "traefik.enable=true"
      # Route Jupyter Lab to http://dhis2-importer.localhost
      - "traefik.http.routers.jupyter.rule=Host(`dhis2-importer.localhost`)"
      - "traefik.http.routers.jupyter.entrypoints=web"
      - "traefik.http.services.jupyter.loadbalancer.server.port=8888"
      
      # Route Streamlit (optional) to http://dhis2-streamlit.localhost
      - "traefik.http.routers.streamlit.rule=Host(`dhis2-streamlit.localhost`)"
      - "traefik.http.routers.streamlit.entrypoints=web"
      - "traefik.http.services.streamlit.loadbalancer.server.port=8501"
    depends_on:
      - traefik
